<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a"><link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Panel del Director</title>
<style>
:root{--bg:#f2f5fb;--card:#fff;--tx:#1b2430;--mu:#6b778c;--navy:#0f2a4a;--red:#d62839;--ok:#1e9e6a;--warn:#f0a21c;--bar:#e6ebf4}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#141d30;--tx:#e8edf7;--mu:#93a1bb;--bar:#25314a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:17px}header small{opacity:.8}
.live{float:right;font-size:12px;display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:#7ee2b0;animation:p 1.4s infinite}.off .dot{background:#f0a21c;animation:none}
@keyframes p{50%{opacity:.3}}
main{padding:14px;display:grid;gap:14px;max-width:720px;margin:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.c h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.big{font-size:30px;font-weight:700;line-height:1.1}.sub{color:var(--mu);font-size:12px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.row .l{width:104px;flex:none}.row .v{width:38px;text-align:right;flex:none;font-weight:600}
.bar{flex:1;height:10px;background:var(--bar);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;transition:width .8s}
.donut{display:flex;align-items:center;gap:16px}.leg div{font-size:13px;margin:3px 0}.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.risk{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bar);font-size:13px}.risk:last-child{border:0}
.pill{background:var(--red);color:#fff;border-radius:10px;padding:2px 9px;font-weight:600}
.ia{background:linear-gradient(135deg,#0f2a4a,#1d4a80);color:#fff}.ia h2{color:#bcd0ee}.ia p{margin:0;white-space:pre-line}
a.dl{display:block;text-align:center;color:var(--navy);font-weight:600;padding:10px;text-decoration:none}@media(prefers-color-scheme:dark){a.dl{color:#9ec1ff}}
</style></head><body>
<header><span class="live" id="live"><span class="dot"></span><span id="liveT">En vivo</span></span>
<h1>Colegio San José María</h1><small>Panel del Director · <span id="upd">cargando…</span></small></header>
<main id="m"><div class="c">Conectando…</div></main>
<script>
const p=new URLSearchParams(location.search);if(p.get("t"))localStorage.setItem("tk",p.get("t"));
const T=localStorage.getItem("tk")||"director2026",API=p.get("api")||"";
const MOT={ECONOMICO:"Económico",MUDANZA:"Mudanza",ACADEMICO:"Académico",CLIMA:"Clima escolar",HORARIO:"Horario",OTRO:"Otro"};
const col=v=>v>=4?"var(--ok)":v>=3?"var(--warn)":"var(--red)";
const bars=(rows,max,fmt,c)=>rows.map(r=>`<div class="row"><span class="l">${r[0]}</span><span class="bar"><i style="width:${Math.min(100,r[1]/max*100)}%;background:${c?c(r[1]):"var(--navy)"}"></i></span><span class="v">${fmt?fmt(r[1]):r[1]}</span></div>`).join("");
function donut(a,b,c){const t=a+b+c||1,R=42,C=2*Math.PI*R;let o=0;
 const s=(v,k)=>{const l=v/t*C,e=`<circle r="${R}" cx="55" cy="55" fill="none" stroke="${k}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 55 55)"/>`;o+=l;return e};
 return `<svg width="110" height="110">${s(a,"#1e9e6a")+s(c,"#f0a21c")+s(b,"#d62839")}<text x="55" y="61" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${Math.round(a/t*100)}%</text></svg>`}
function render(k){
 const mot=Object.entries(k.motivos||{}).sort((a,b)=>b[1]-a[1]).map(([m,n])=>[MOT[m]||m,n]),mx=Math.max(1,...mot.map(x=>x[1]));
 const stars="★".repeat(Math.round(k.csat))+"☆".repeat(5-Math.round(k.csat));
 m.innerHTML=`
 <div class="g2">
  <div class="c"><h2>Matriculados</h2><div class="big">${k.total}</div><div class="sub">${k.vacantes} vacantes de ${k.capacidad}</div></div>
  <div class="c"><h2>Asistencia</h2><div class="big">${k.asistencia}%</div><div class="sub">promedio del colegio</div></div>
  <div class="c"><h2>Satisfacción</h2><div class="big">${k.csat}<small style="font-size:14px">/5</small></div><div class="sub" style="color:var(--warn)">${stars}</div><div class="sub">${k.encuestas} encuestas · NPS ${k.nps}</div></div>
  <div class="c"><h2>Rendimiento</h2><div class="big">${k.promedio}</div><div class="sub">promedio general /20</div></div>
 </div>
 <div class="c"><h2>¿Continuarán el próximo ciclo?</h2><div class="donut">${donut(k.continuan,k.noContinuan,k.indecisos)}
  <div class="leg"><div><b style="background:#1e9e6a"></b>Continúan: <strong>${k.continuan}</strong></div><div><b style="background:#f0a21c"></b>Indecisos: <strong>${k.indecisos}</strong></div><div><b style="background:#d62839"></b>No continúan: <strong>${k.noContinuan}</strong></div></div></div></div>
 <div class="c"><h2>Motivos de no continuidad</h2>${mot.length?bars(mot,mx,null,()=>"var(--red)"):'<span class="sub">Sin datos</span>'}</div>
 <div class="c"><h2>Satisfacción por tema</h2>${bars(k.temas.map(t=>[t.tema,t.prom]),5,v=>v.toFixed(1),col)}</div>
 <div class="c"><h2>Promedio por grado</h2>${bars(k.porGrado.map(g=>[g.grado,g.prom]),20,v=>v.toFixed(1),v=>v>=14?"var(--ok)":v>=12?"var(--warn)":"var(--red)")}</div>
 <div class="c"><h2>Alumnos en riesgo <span class="pill">${k.riesgoAlto}</span></h2>${k.enRiesgo.map(a=>`<div class="risk"><span class="n"></span><b>${a.riesgo}%</b></div>`).join("")||'<span class="sub">Ninguno 🎉</span>'}</div>
 <div class="c ia"><h2>🤖 Voz de Familia (IA)</h2><p id="voz">Analizando…</p></div>
 <div class="c ia"><h2>🤖 Agente de Retención (IA)</h2><p id="ret">Analizando…</p></div>
 <a class="dl" href="${API}/api/alumnos/export.xlsx">⬇ Descargar matriculados en Excel</a>`;
 // nombres con textContent (evita inyectar HTML)
 document.querySelectorAll(".risk .n").forEach((e,i)=>e.textContent=k.enRiesgo[i].alumno+" · "+k.enRiesgo[i].grado);
 voz.textContent=vozT;ret.textContent=retT;
 upd.textContent="act. "+new Date(k.actualizado).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
let ult=0,vozT="Analizando…",retT="Analizando…";
async function agentes(){try{const[v,r]=await Promise.all([fetch(`${API}/api/agentes/voz?t=${T}`).then(x=>x.json()),fetch(`${API}/api/agentes/retencion?t=${T}`).then(x=>x.json())]);
 vozT=v.resumen;retT=r.recomendacion;voz.textContent=vozT;ret.textContent=retT}catch(e){}}
function conectar(){
 const es=new EventSource(`${API}/api/kpis/stream?t=${T}`);
 es.addEventListener("kpis",e=>{live.classList.remove("off");liveT.textContent="En vivo";render(JSON.parse(e.data));if(Date.now()-ult>60000){ult=Date.now();agentes()}});
 es.onerror=()=>{live.classList.add("off");liveT.textContent="Reconectando…"};
}
conectar();
</script></body></html>
