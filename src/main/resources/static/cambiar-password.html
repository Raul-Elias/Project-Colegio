<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cambiar contraseña</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cambiar contraseña</h1>
  <p style="text-align:center;">Es tu primer ingreso. Debes cambiar tu contraseña para continuar.</p>
  <form id="formCambio" style="max-width:320px;margin:auto;flex-direction:column;">
    <input id="actual" type="password" placeholder="Contraseña actual" required>
    <input id="nueva" type="password" placeholder="Nueva contraseña (mínimo 8 caracteres)" required>
    <input id="confirmar" type="password" placeholder="Confirmar nueva contraseña" required>
    <button type="submit">Guardar contraseña</button>
    <p id="mensaje" style="color:red;"></p>
  </form>

  <script>
    const correo = sessionStorage.getItem("correo");
    if (!correo) {
      window.location.href = "login.html";
    }

    document.getElementById("formCambio").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nueva = document.getElementById("nueva").value;
      const mensaje = document.getElementById("mensaje");

      if (nueva !== document.getElementById("confirmar").value) {
        mensaje.textContent = "Las contraseñas nuevas no coinciden";
        return;
      }

      const res = await fetch("/api/auth/cambiar-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          correo: correo,
          passwordActual: document.getElementById("actual").value,
          passwordNueva: nueva
        })
      });
      const datos = await res.json();
      if (res.ok) {
        sessionStorage.clear();
        alert("Contraseña actualizada. Inicia sesión con tu nueva contraseña.");
        window.location.href = "login.html";
      } else {
        mensaje.textContent = datos.mensaje;
      }
    });
  </script>
</body>
</html>
