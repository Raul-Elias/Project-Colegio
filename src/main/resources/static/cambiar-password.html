<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar contraseña</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="acceso">
  <div class="tarjeta">
    <p class="marca">Colegio San Jose Maria</p>
    <h1>Cambiar contraseña</h1>
    <p class="ayuda">Es tu primer ingreso. Debes cambiar tu contraseña para continuar.</p>

    <form id="formCambio">
      <input id="actual" type="password" placeholder="Contraseña actual" required autocomplete="current-password">
      <input id="nueva" type="password" placeholder="Nueva contraseña (mínimo 8 caracteres)" required autocomplete="new-password">
      <input id="confirmar" type="password" placeholder="Confirmar nueva contraseña" required autocomplete="new-password">
      <button type="submit">Guardar contraseña</button>
    </form>
    <p id="mensaje" class="mensaje error"></p>
  </div>

  <script>
    const correo = sessionStorage.getItem("correo");
    if (!correo) {
      window.location.href = "login.html";
    }

    document.getElementById("formCambio").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nueva = document.getElementById("nueva").value;
      const mensaje = document.getElementById("mensaje");
      mensaje.textContent = "";

      if (nueva !== document.getElementById("confirmar").value) {
        mensaje.textContent = "Las contraseñas nuevas no coinciden";
        return;
      }

      try {
        const res = await fetch("/api/auth/cambiar-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            correo: correo,
            passwordActual: document.getElementById("actual").value,
            passwordNueva: nueva
          })
        });
        const datos = await res.json();
        if (res.ok) {
          sessionStorage.clear();
          alert("Contraseña actualizada. Inicia sesión con tu nueva contraseña.");
          window.location.href = "login.html";
        } else {
          mensaje.textContent = datos.mensaje;
        }
      } catch (err) {
        mensaje.textContent = "No se pudo conectar con el servidor";
      }
    });
  </script>
</body>
</html>
